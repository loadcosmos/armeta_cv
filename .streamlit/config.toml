[server]
# Server configuration
maxUploadSize = 10  # Max file size in MB
enableCORS = true
enableXsrfProtection = true
headless = true

[browser]
# Browser configuration
gatherUsageStats = false

[theme]
# UI theme
primaryColor = "#667eea"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"
